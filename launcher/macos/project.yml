# XcodeGen spec for the 3ds2apple macOS launcher.
#
# Generate/build on macOS (Xcode 26.6 on the build VM):
#   cd launcher/macos && PATH=/usr/local/bin:$PATH xcodegen generate --spec project.yml
#   xcodebuild -project 3ds2apple-launcher.xcodeproj -scheme 3ds2apple-launcher \
#     -configuration Release -destination 'platform=macOS' -derivedDataPath build build
#
# The generated .xcodeproj / build/ / Support/Info.plist are build artifacts and
# are gitignored. Resources/ holds the derived app icon (same artwork as the iOS
# shell app) and the en / zh-Hans InfoPlist.strings used for the localized app name.
name: 3ds2apple-launcher

options:
  bundleIdPrefix: com.kratos
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Development build: unsigned by default, runs locally on the user's Mac.
    # The launcher never signs this app; signing happens at install time in Xcode.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      ONLY_ACTIVE_ARCH: "NO"
      ARCHS: "arm64 x86_64"

targets:
  "3ds2apple-launcher":
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
      # XcodeGen infers resource phases from the file types; .icns/.png and the
      # en.lproj / zh-Hans.lproj InfoPlist.strings are copied into the bundle.
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "3ds2apple Launcher"
        CFBundleName: "3ds2apple Launcher"
        CFBundleIconFile: "AppIcon"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: "APPL"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "en"
        CFBundleLocalizations: ["en", "zh-Hans"]
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright 2026 3ds2apple contributors. Apache-2.0."
    settings:
      base:
        PRODUCT_NAME: "3ds2apple-launcher"
        PRODUCT_BUNDLE_IDENTIFIER: "com.kratos.3ds2apple.launcher"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "Support/Info.plist"

schemes:
  "3ds2apple-launcher":
    build:
      targets:
        "3ds2apple-launcher": all
    run:
      config: Debug
    archive:
      config: Release
