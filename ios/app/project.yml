# XcodeGen spec for the 3ds2apple SwiftUI shell (I1 skeleton).
#
# Generate on macOS:   cd ios/app && xcodegen generate
# Build:               see ios/app/README.md
#
# The generated 3ds2apple.xcodeproj is a build artifact: do not commit it.

name: 3ds2apple

options:
  bundleIdPrefix: com.kratos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # English is the development language; Localizable.strings also ships
  # Simplified Chinese (Resources/zh-Hans.lproj). iOS picks the table from the
  # system language and falls back to English for every other language.
  developmentLanguage: en

targets:
  "3ds2apple":
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # Localized text: Resources/en.lproj and Resources/zh-Hans.lproj each hold
      # a Localizable.strings table. XcodeGen groups the two into one localized
      # resource and adds both languages to the project's known regions.
      - path: Resources
        buildPhase: resources
    settings:
      base:
        # --- Identity -----------------------------------------------------
        # PRODUCT_NAME / EXECUTABLE_NAME are explicit on purpose: without
        # them Xcode can emit a nameless ".app".
        PRODUCT_NAME: "3ds2apple"
        EXECUTABLE_NAME: "3ds2apple"
        PRODUCT_BUNDLE_IDENTIFIER: "com.kratos.3ds2apple"
        MARKETING_VERSION: "0.2.0-beta1"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "3ds2apple"
        INFOPLIST_KEY_MetalHudEnabled: "YES"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.2.0-beta1"
        INFOPLIST_KEY_CFBundleVersion: "9"
        # Let iTunes/Finder and the Files app see Documents/ (ROM transfer).
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"

        # --- Info.plist ---------------------------------------------------
        # XcodeGen writes build/Info.plist (gitignored) from the target's info
        # block at the end of this file. It is explicit because iOS file
        # sharing needs BOTH UIFileSharingEnabled and
        # LSSupportsOpeningDocumentsInPlace to make Documents/Games visible in
        # the Files app, and the synthesized plist only maps a known subset of
        # INFOPLIST_KEY_* settings (UIFileSharingEnabled was silently dropped).
        GENERATE_INFOPLIST_FILE: "NO"

        # --- Signing ------------------------------------------------------
        # Built unsigned; Sideloadly/AltStore signs on the user's machine.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

        # --- Swift / C interop -------------------------------------------
        SWIFT_VERSION: "5.0"
        # C ABI header lives one level up (ios/ZakuroBridge.h) and is pulled
        # in through SWIFT_OBJC_BRIDGING_HEADER, so Swift calls zk_* directly.
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../ZakuroBridge.h"
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/.."]

        # --- Zakuro static library ---------------------------------------
        # build/ios/libzakuro_ios.a is produced by
        # scripts/build-zakuro-ios.sh (repo-root build/, gitignored).
        # SRCROOT is ios/app, so ../../build/ios is <repo>/build/ios.
        OTHER_LDFLAGS: ["-L$(SRCROOT)/../../build/ios", "-lzakuro_ios"]
    # Info.plist rooted at a gitignored path so both this project and the
    # simulator build (scripts/build-ios-app-sim.sh copies this spec into
    # build/sim/shell) resolve it as <project>/build/Info.plist.
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: "3ds2apple"
        MetalHudEnabled: true
        # iOS file sharing: the desktop launcher writes Documents/Games/ and
        # the Files app / Finder shows the same folder to the user.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The Info.plist is generated by XcodeGen; it does not inherit
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION unless named here.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
