# XcodeGen spec for the 3ds2apple UI preview harness (ios/preview/).
#
# The preview app is a second, simulator-only @main app. It compiles the real
# shell sources (ios/app/Sources, minus App.swift) and links the generated C
# stub (ios/preview/generated/ZakuroStub.c) instead of libzakuro_ios.a, so it
# builds and runs in the iOS Simulator on the Intel macOS build VM.
#
# Run it with scripts/ios-ui-preview.sh. That script generates the stub first,
# then runs:
#
#   xcodegen generate --spec ios/preview/project.yml \
#       --project ios/preview/build --project-root <repository root>
#   xcodebuild -project ios/preview/build/3ds2apple-preview.xcodeproj ...
#
# Relative paths below are resolved against the project root (--project-root,
# i.e. the repository root), NOT against this file's directory. The generated
# project lives in ios/preview/build (gitignored), so SRCROOT is
# <repo>/ios/preview/build and the bridging header sits two levels up.

name: 3ds2apple-preview

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"

targets:
  "3ds2apple-preview":
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # The real shell sources. App.swift is the shell's @main and is replaced
      # by PreviewMain.swift, so it is excluded here (two @main types would not
      # compile).
      - path: ios/app/Sources
        excludes:
          - App.swift
      # Localizable.strings only (en.lproj + zh-Hans.lproj); copied as-is.
      - path: ios/app/Resources
        buildPhase: resources
      - path: ios/preview/PreviewMain.swift
      # Generated by scripts/gen-zakuro-stub.py before xcodegen runs. It must
      # exist: the target links no static library, so without the stub the link
      # fails loudly instead of silently using something else.
      - path: ios/preview/generated/ZakuroStub.c
    settings:
      base:
        # --- identity -----------------------------------------------------
        PRODUCT_NAME: "3ds2apple-preview"
        EXECUTABLE_NAME: "3ds2apple-preview"
        PRODUCT_BUNDLE_IDENTIFIER: "com.kratos.3ds2apple.preview"
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "3ds2apple preview"
        INFOPLIST_KEY_MetalHudEnabled: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

        # --- signing: simulator only, unsigned like the shell --------------
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

        # --- Swift / C interop ---------------------------------------------
        SWIFT_VERSION: "5.0"
        # SRCROOT is ios/preview/build (where the generated project lives), so
        # ios/ZakuroBridge.h is $(SRCROOT)/../.. and the header search path is
        # the ios/ directory itself.
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../../ZakuroBridge.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../.."

        # --- simulator build -----------------------------------------------
        # The simulator runtime on the Intel VM is x86_64, but build every
        # standard simulator slice so the generic "iOS Simulator" destination
        # always produces an app the host can install.
        ONLY_ACTIVE_ARCH: "NO"

        # No libzakuro_ios.a here on purpose: every zk_* symbol comes from
        # ZakuroStub.c. Do NOT add -lzakuro_ios.

schemes:
  "3ds2apple-preview":
    build:
      targets:
        "3ds2apple-preview": all
    run:
      config: Debug
    archive:
      config: Release
