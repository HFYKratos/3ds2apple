[workspace]
resolver = "2"
members = ["core", "pack"]

[workspace.package]
version = "0.1.4-beta1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
builder-core = { path = "core", version = "0.1.4-beta1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
