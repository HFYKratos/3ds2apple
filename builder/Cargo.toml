[workspace]
resolver = "2"
members = ["core", "cli", "agent", "linux", "windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
builder-core = { path = "core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
