[package]
name = "builder-linux"
description = "Linux desktop frontend for the 3ds2apple Builder: build your own ROM into an unsigned IPA on a macOS VM or Mac you control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "3ds2apple-builder"
path = "src/main.rs"

[dependencies]
builder-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
