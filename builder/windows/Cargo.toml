[package]
name = "builder-windows"
description = "3ds2apple Builder for Windows: a CLI-first desktop frontend that drives a macOS Build Agent over SSH"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "builder-windows"
path = "src/main.rs"

[lib]
name = "builder_windows"
path = "src/lib.rs"

[dependencies]
builder-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
